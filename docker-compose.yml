# Whole system: `docker compose up --build`, then open http://localhost:8080
name: trade-blotter

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-blotter}:${RABBITMQ_PASSWORD:-blotter}@rabbitmq:5672
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-blotter}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blotter}
      POSTGRES_DB: ${POSTGRES_DB:-blotter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blotter}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-blotter}
    ports:
      - '5672:5672'
      - '15672:15672' # management UI
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 30

  trade-service:
    build:
      context: .
      target: nest
      args: { APP: '@blotter/trade-service', APP_DIR: backend/services/trade }
    environment:
      <<: *rabbitmq-env
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-blotter}:${POSTGRES_PASSWORD:-blotter}@postgres:5432/${POSTGRES_DB:-blotter}
    # Apply migrations, then start (the service seeds trades itself when the table is empty).
    command:
      - sh
      - -c
      - cd /repo/database && pnpm exec prisma migrate deploy && cd /repo/backend/services/trade && node dist/main.js
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  api:
    build:
      context: .
      target: nest
      args: { APP: '@blotter/api', APP_DIR: backend/api }
    environment:
      <<: *rabbitmq-env
      NODE_ENV: production
      PORT: 3000
      RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-5000}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  realtime:
    build:
      context: .
      target: nest
      args: { APP: '@blotter/realtime', APP_DIR: backend/realtime }
    environment:
      <<: *rabbitmq-env
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - '${REALTIME_PORT:-3001}:3001'
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        APP: '@blotter/frontend'
        APP_DIR: frontend
        API_INTERNAL_URL: http://api:3000
        REALTIME_INTERNAL_URL: http://realtime:3001
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
